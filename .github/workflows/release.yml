name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build (e.g. v0.1.101)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

env:
  # onnxruntime-node binary download fails in CI; we only use the web build
  ONNXRUNTIME_NODE_DISABLE_DOWNLOAD: 1

# workflow_dispatch must run from the fixed source commit while targeting the
# existing GitHub Release/tag for artifact upload.

jobs:
  release-context:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      tag_sha: ${{ steps.resolve.outputs.tag_sha }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - name: Resolve release tag and build source
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$REQUESTED_TAG"
            SOURCE_SHA="$DISPATCH_SHA"
            TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" --jq '.object.sha')"
            TAG_TYPE="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" --jq '.object.type')"
            if [ "$TAG_TYPE" = "tag" ]; then
              TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$TAG_SHA" --jq '.object.sha')"
            fi
          else
            TAG="$REF_NAME"
            TAG_SHA="$DISPATCH_SHA"
            SOURCE_SHA="$DISPATCH_SHA"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a vMAJOR.MINOR.PATCH release tag; got '$TAG'"
            exit 1
          fi
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  check-ci:
    runs-on: ubuntu-latest
    needs: release-context
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-context.outputs.source_sha }}
      - name: Wait for CI and check status
        uses: actions/github-script@v7
        with:
          script: |
            const MAX_ATTEMPTS = 30;
            const POLL_SECONDS = 20;
            const releaseSha = '${{ needs.release-context.outputs.source_sha }}';
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              commit_sha: releaseSha,
              event: 'push',
              per_page: 10,
            });
            let lastRun = runs.workflow_runs.find((run) => run.conclusion === 'success')
              ?? runs.workflow_runs[0];
            if (!lastRun) {
              core.setFailed(`No CI workflow run found for release commit ${releaseSha}.`);
              return;
            }
            for (let attempt = 1; lastRun.conclusion === null && attempt < MAX_ATTEMPTS; attempt++) {
              console.log(`Attempt ${attempt}/${MAX_ATTEMPTS}: CI still running (${lastRun.status}), waiting ${POLL_SECONDS}s...`);
              await new Promise(r => setTimeout(r, POLL_SECONDS * 1000));
              const { data: refreshed } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                commit_sha: releaseSha,
                event: 'push',
                per_page: 10,
              });
              lastRun = refreshed.workflow_runs.find((run) => run.conclusion === 'success')
                ?? refreshed.workflow_runs[0];
            }
            if (lastRun.conclusion !== 'success') {
              core.setFailed(`CI workflow did not pass for release commit ${releaseSha}. Status: ${lastRun.conclusion}. See: ${lastRun.html_url}`);
              return;
            }
            console.log(`CI passed for release commit ${releaseSha}: ${lastRun.html_url}`);

  create-release:
    runs-on: ubuntu-latest
    needs: [release-context, check-ci]
    steps:
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --draft --title "Release $RELEASE_TAG" --generate-notes

  tauri-linux:
    runs-on: ubuntu-latest
    needs: [release-context, create-release]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-context.outputs.source_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run tauri:build
        env:
          TAURI_TARGET_PLATFORM: linux
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload Release Artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag_name }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm src-tauri/target/release/bundle/appimage/*.AppImage)
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

  tauri-windows:
    runs-on: windows-latest
    needs: [release-context, create-release]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-context.outputs.source_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run tauri:build
        env:
          TAURI_TARGET_PLATFORM: windows
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload Release Artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" src-tauri/target/release/bundle/msi/*.msi --clobber

  android:
    runs-on: ubuntu-latest
    needs: [release-context, create-release]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-context.outputs.source_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install bundletool
        run: |
          curl -fsSL https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
          echo "BUNDLETOOL_JAR=$RUNNER_TEMP/bundletool.jar" >> "$GITHUB_ENV"
      - name: Install Android SDK components
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" "build-tools;36.0.0" \
            --sdk_root=${ANDROID_SDK_ROOT}
      - run: npm ci
        env:
          HUSKY: 0
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
      - name: Setup signing and build
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag_name }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          export ANDROID_VERSION_CODE="$(node scripts/android-version-code.mjs code "$RELEASE_TAG")"
          node scripts/patch-android-build.mjs
          cd android && ./gradlew bundleRelease
      - name: Verify release AAB
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.tag_name }}
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
        run: |
          set -euo pipefail
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "::error::$AAB_PATH was not produced — the release has no Play-uploadable artifact."
            ls -la android/app/build/outputs/bundle/release/ 2>/dev/null || true
            exit 1
          fi
          echo "Release AAB: $(du -h "$AAB_PATH" | cut -f1)"
          EXPECTED_VERSION_CODE="$(node scripts/android-version-code.mjs code "$RELEASE_TAG")"
          node scripts/android-version-code.mjs verify "$AAB_PATH" "$EXPECTED_VERSION_CODE"
          echo "Verified Android versionCode: $EXPECTED_VERSION_CODE"
      - name: Upload Release Artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" android/app/build/outputs/bundle/release/app-release.aab --clobber
          gh release edit "$RELEASE_TAG" --draft=false


