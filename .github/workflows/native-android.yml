name: Native Android
on:
  pull_request:
    paths:
      - '.github/workflows/native-android.yml'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/offline-games*'
      - 'capacitor.config.ts'
      - 'package*.json'
permissions:
  contents: read
jobs:
  android-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ONNXRUNTIME_NODE_DISABLE_DOWNLOAD: 1
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Add test-only game fixture to the debug APK
        run: node scripts/build-native-game-harness.mjs
      - run: npx cap add android
      - run: npm run cap:sync
        env:
          CAPACITOR_PLATFORM: android
          GITHUB_REF_NAME: ''
      - name: Build debug APK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' > /dev/null
          cd android
          ./gradlew assembleDebug
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Test the Android WebView online, after an offline restart, and with a downloaded game
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: node scripts/android-gui-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-android-offline
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-gui-artifacts/
