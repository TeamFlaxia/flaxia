name: Deploy

# CI (.github/workflows/ci.yml) が main で成功したときだけデプロイする。
# push を直接トリガーにすると CI の成否と無関係にデプロイが走ってしまうため、
# CI の完了 (workflow_run: completed) を受けて、成功時のみ実行する。
# 手動実行 (workflow_dispatch) は従来どおり常に実行できる。
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  ONNXRUNTIME_NODE_DISABLE_DOWNLOAD: 1

jobs:
  deploy-pages:
    # workflow_run はトリガー元の成否に関係なく発火するため、ここで判定する。
    # event == 'push' は fork の PR (head_branch が main と同名) を除外するため。
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    # Pages binds MAIL_SERVICE by service name; keep using the existing Mail
    # Worker when the Mail deployment is temporarily unavailable instead of
    # blocking the site deployment on an unrelated Worker API failure.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # workflow_run の github.sha は default branch の最新コミットを指すため、
      # CI が検証したコミットを明示的にチェックアウトする。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          SANDBOX_ORIGIN: https://sandbox.flaxia.app
      - name: Reconcile pre-existing D1 schema changes
        # A migration can be present in the remote schema without being recorded
        # in d1_migrations (for example after a manual hotfix). Wrangler would
        # replay the ALTER and fail with "duplicate column name". Mark only those
        # migrations as applied whose column already exists; fresh databases keep
        # the normal migration path.
        run: |
          set -euo pipefail
          query() {
            npx wrangler d1 execute flaxia --remote --json --command "$1" |
              node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const r of (JSON.parse(s)[0]?.results||[])) if(r.name) console.log(r.name)})'
          }
          contains() { printf '%s\n' "$2" | grep -qx "$1"; }
          npx wrangler d1 execute flaxia --remote --command \
            'CREATE TABLE IF NOT EXISTS d1_migrations (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT UNIQUE, applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL)' >/dev/null
          posts_columns=$(query "SELECT name FROM pragma_table_info('posts')")
          actor_columns=$(query "SELECT name FROM pragma_table_info('ap_actors')")
          applied=$(query 'SELECT name FROM d1_migrations')
          reconcile() {
            local migration="$1" column="$2" columns="$3"
            if contains "$column" "$columns" && ! contains "$migration" "$applied"; then
              echo "Marking $migration as applied: column $column already exists in production"
              npx wrangler d1 execute flaxia --remote --command \
                "INSERT OR IGNORE INTO d1_migrations (name) VALUES ('$migration')" >/dev/null
            fi
          }
          reconcile 0148_add_post_visibility.sql visibility "$posts_columns"
          reconcile 0149_ap_actor_summary.sql summary "$actor_columns"
          reconcile 0153_reply_visibility_root.sql visibility_root_author_id "$posts_columns"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply production D1 migrations
        run: |
          set -euo pipefail
          retry() { local n=0; until "$@"; do n=$((n+1)); if [ "$n" -ge 5 ]; then return 1; fi; echo "retrying in 15s ($n/5): $*"; sleep 15; done; }
          retry npx wrangler d1 migrations apply flaxia --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Pages
        run: |
          set -euo pipefail
          retry() { local n=0; until "$@"; do n=$((n+1)); if [ "$n" -ge 5 ]; then return 1; fi; echo "retrying in 15s ($n/5): $*"; sleep 15; done; }
          retry npx wrangler pages deploy .svelte-kit/cloudflare --branch "$DEPLOY_BRANCH"
        env:
          DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-sandbox:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Deploy Sandbox Worker
        run: |
          set -euo pipefail
          retry() { local n=0; until "$@"; do n=$((n+1)); if [ "$n" -ge 5 ]; then return 1; fi; echo "retrying in 15s ($n/5): $*"; sleep 15; done; }
          retry npm run deploy:sandbox
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-queue:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    # The backend worker binds MAIL_SERVICE for scheduled account deletion and
    # reads mail_deletion_outbox. Mail is deployed from TeamFlaxia/flaxia-mail on
    # its own schedule; deploy that repo before deploying this worker whenever
    # the mail internal API changes.
    needs: [deploy-pages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Ensure ActivityPub dead-letter queue exists
        run: node scripts/ensure-activitypub-dlq.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Queue Worker
        run: |
          set -euo pipefail
          retry() { local n=0; until "$@"; do n=$((n+1)); if [ "$n" -ge 5 ]; then return 1; fi; echo "retrying in 15s ($n/5): $*"; sleep 15; done; }
          retry npx wrangler deploy functions/queue-worker.ts --name flaxia-ap-delivery --config wrangler.worker.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-do:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Deploy DO Worker (NotificationStream)
        run: |
          set -euo pipefail
          retry() { local n=0; until "$@"; do n=$((n+1)); if [ "$n" -ge 5 ]; then return 1; fi; echo "retrying in 15s ($n/5): $*"; sleep 15; done; }
          retry npx wrangler deploy --config do-worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-multiplayer:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Deploy Multiplayer DO Worker
        run: |
          set -euo pipefail
          retry() { local n=0; until "$@"; do n=$((n+1)); if [ "$n" -ge 5 ]; then return 1; fi; echo "retrying in 15s ($n/5): $*"; sleep 15; done; }
          retry npm run deploy:multiplayer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
