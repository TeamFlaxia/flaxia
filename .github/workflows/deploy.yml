name: Deploy

# CI (.github/workflows/ci.yml) が main で成功したときだけデプロイする。
# push を直接トリガーにすると CI の成否と無関係にデプロイが走ってしまうため、
# CI の完了 (workflow_run: completed) を受けて、成功時のみ実行する。
# 手動実行 (workflow_dispatch) は従来どおり常に実行できる。
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  ONNXRUNTIME_NODE_DISABLE_DOWNLOAD: 1

jobs:
  deploy-pages:
    # workflow_run はトリガー元の成否に関係なく発火するため、ここで判定する。
    # event == 'push' は fork の PR (head_branch が main と同名) を除外するため。
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    # Pages binds MAIL_SERVICE by service name; keep using the existing Mail
    # Worker when the Mail deployment is temporarily unavailable instead of
    # blocking the site deployment on an unrelated Worker API failure.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # workflow_run の github.sha は default branch の最新コミットを指すため、
      # CI が検証したコミットを明示的にチェックアウトする。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          SANDBOX_ORIGIN: https://sandbox.flaxia.app
      - name: Apply production D1 migrations
        run: |
          set -euo pipefail
          retry() { local n=0; until "$@"; do n=$((n+1)); if [ "$n" -ge 5 ]; then return 1; fi; echo "retrying in 15s ($n/5): $*"; sleep 15; done; }
          retry npx wrangler d1 migrations apply flaxia --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Pages
        run: |
          set -euo pipefail
          retry() { local n=0; until "$@"; do n=$((n+1)); if [ "$n" -ge 5 ]; then return 1; fi; echo "retrying in 15s ($n/5): $*"; sleep 15; done; }
          retry npx wrangler pages deploy dist --branch "$DEPLOY_BRANCH"
        env:
          DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-sandbox:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Deploy Sandbox Worker
        run: |
          set -euo pipefail
          retry() { local n=0; until "$@"; do n=$((n+1)); if [ "$n" -ge 5 ]; then return 1; fi; echo "retrying in 15s ($n/5): $*"; sleep 15; done; }
          retry npm run deploy:sandbox
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-queue:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    # The backend worker binds MAIL_SERVICE for scheduled account deletion and
    # reads mail_deletion_outbox, so Mail must exist and main migrations must
    # have run first.
    needs: [deploy-mail, deploy-pages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Ensure ActivityPub dead-letter queue exists
        run: node scripts/ensure-activitypub-dlq.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Queue Worker
        run: |
          set -euo pipefail
          retry() { local n=0; until "$@"; do n=$((n+1)); if [ "$n" -ge 5 ]; then return 1; fi; echo "retrying in 15s ($n/5): $*"; sleep 15; done; }
          retry npx wrangler deploy functions/queue-worker.ts --name flaxia-backend --config wrangler.toml.worker --compatibility-date 2026-06-02
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-do:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Deploy DO Worker (NotificationStream)
        run: |
          set -euo pipefail
          retry() { local n=0; until "$@"; do n=$((n+1)); if [ "$n" -ge 5 ]; then return 1; fi; echo "retrying in 15s ($n/5): $*"; sleep 15; done; }
          retry npx wrangler deploy --config do-worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-mail:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply Mail D1 migrations
        run: |
          set -euo pipefail
          retry() { local n=0; until "$@"; do n=$((n+1)); if [ "$n" -ge 5 ]; then return 1; fi; echo "retrying in 15s ($n/5): $*"; sleep 15; done; }
          retry npx wrangler d1 migrations apply flaxia-mail --remote --config mail-worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Mail Worker
        run: |
          set -euo pipefail
          retry() { local n=0; until "$@"; do n=$((n+1)); if [ "$n" -ge 5 ]; then return 1; fi; echo "retrying in 15s ($n/5): $*"; sleep 15; done; }
          retry npx wrangler deploy --config mail-worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    needs: deploy-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the public deployment
        run: |
          set -euo pipefail
          base="https://flaxia.app"
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          retry() { curl -fsS -A "$ua" --retry 10 --retry-delay 3 --retry-all-errors "$@"; }

          curl -fsS -A "$ua" -o /dev/null --retry 20 --retry-delay 3 --retry-all-errors "$base/maps"
          curl -fsS -A "$ua" -o /dev/null --retry 20 --retry-delay 3 --retry-all-errors "$base/translate"

          # ActivityPub discovery must answer directly (no redirect that peers
          # may refuse) so Mastodon can resolve the account.
          retry -H 'Accept: application/jrd+json' "$base/.well-known/webfinger?resource=acct:remydrescarlet@flaxia.app" | grep -q '"subject"'
          retry -H 'Accept: application/jrd+json' -D /tmp/webfinger.headers "$base/.well-known/webfinger?resource=acct:remydrescarlet@flaxia.app" >/dev/null
          grep -qi '^content-type: application/jrd+json' /tmp/webfinger.headers
          retry "$base/.well-known/nodeinfo" | grep -q 'nodeinfo.diaspora.software'

          # Generated MapLibre worker is served from the Pages deployment.
          retry "$base/maplibre-worker.js" | grep -q 'addProtocol'
          retry "$base/api/maps/cities" | grep -q '"tokyo"'
          retry "$base/api/search/v2?q=flaxia&tab=posts&limit=1" | grep -q '"posts"'
          retry "$base/api/tags/trending" | grep -q '"tags"'
          retry "$base/api/titles" | grep -q '"titles"'
