name: Deploy

# CI (.github/workflows/ci.yml) が main で成功したときだけデプロイする。
# push を直接トリガーにすると CI の成否と無関係にデプロイが走ってしまうため、
# CI の完了 (workflow_run: completed) を受けて、成功時のみ実行する。
# 手動実行 (workflow_dispatch) は従来どおり常に実行できる。
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  ONNXRUNTIME_NODE_DISABLE_DOWNLOAD: 1

jobs:
  deploy-pages:
    # workflow_run はトリガー元の成否に関係なく発火するため、ここで判定する。
    # event == 'push' は fork の PR (head_branch が main と同名) を除外するため。
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    # Pages binds MAIL_SERVICE, so the Worker must exist first (first deploy).
    needs: deploy-mail
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # workflow_run の github.sha は default branch の最新コミットを指すため、
      # CI が検証したコミットを明示的にチェックアウトする。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          SANDBOX_ORIGIN: https://sandbox.flaxia.app
      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply flaxia --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --branch "$DEPLOY_BRANCH"
        env:
          DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-sandbox:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Deploy Sandbox Worker
        run: npm run deploy:sandbox
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-queue:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    # The backend worker binds MAIL_SERVICE for scheduled account deletion and
    # reads mail_deletion_outbox, so Mail must exist and main migrations must
    # have run first.
    needs: [deploy-mail, deploy-pages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Ensure ActivityPub dead-letter queue exists
        run: node scripts/ensure-activitypub-dlq.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Queue Worker
        run: npx wrangler deploy functions/queue-worker.ts --name flaxia-backend --config wrangler.toml.worker --compatibility-date 2026-06-02
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-do:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Deploy DO Worker (NotificationStream)
        run: npx wrangler deploy --config do-worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-mail:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Configure Mail D1 database id
        run: |
          if ! [[ "$MAIL_D1_DATABASE_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "::error::Add the MAIL_D1_DATABASE_ID repository secret (id from 'wrangler d1 create flaxia-mail')."
            exit 1
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$MAIL_D1_DATABASE_ID/" mail-worker/wrangler.toml
        env:
          MAIL_D1_DATABASE_ID: ${{ secrets.MAIL_D1_DATABASE_ID }}
      - name: Apply Mail D1 migrations
        run: npx wrangler d1 migrations apply flaxia-mail --remote --config mail-worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Mail Worker
        run: npx wrangler deploy --config mail-worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
