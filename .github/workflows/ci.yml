name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # onnxruntime-node binary download fails in CI; we only use the web build
  ONNXRUNTIME_NODE_DISABLE_DOWNLOAD: 1

jobs:
  game-loader-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Use the runner's installed Chrome; avoid OS package/browser downloads.
      - run: npm install --prefix "$RUNNER_TEMP/flaxia-browser-tools" --package-lock=false --ignore-scripts playwright@1.62.1
      - run: npm run build:game-loader
      - run: node scripts/build-native-game-harness.mjs
      - run: npm run test:game-loader:browser
        env:
          LOADER_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/flaxia-browser-tools/node_modules/playwright/index.mjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx @biomejs/biome ci .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Apply migrations before starting the readiness timeout
        run: npm run migrate:local
      - name: Start dev server and run tests
        run: |
          set -o pipefail
          # The pages dev server binds Durable Objects hosted by these two
          # workers; start them first so the bindings connect.
          npm run dev:do &
          DO_PID=$!
          npm run dev:multiplayer &
          MP_PID=$!
          npm run dev:test &
          SERVER_PID=$!
          SERVER_READY=false
          for i in $(seq 1 60); do
            if curl -s http://localhost:8788 > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              SERVER_READY=true
              break
            fi
            sleep 1
          done
          if [ "$SERVER_READY" = false ]; then
            echo "Server failed to start within 60s"
            kill $SERVER_PID $MP_PID $DO_PID 2>/dev/null || true
            exit 1
          fi
          mkdir -p coverage
          EXIT_CODE=0
          npm test -- --experimental-test-coverage 2>&1 | tee coverage/test-output.log || EXIT_CODE=$?
          kill $SERVER_PID $MP_PID $DO_PID 2>/dev/null || true
          exit "$EXIT_CODE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build

  arcade-cold-load:
    # Build and benchmark this PR's exact merge candidate in an isolated Pages preview.
    # Cloudflare credentials are only available to same-repository PRs.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build PR candidate
        run: npm run build
      - name: Install isolated Playwright tools
        run: npm install --prefix "$RUNNER_TEMP/flaxia-browser-tools" --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Install Firefox engine
        run: node "$RUNNER_TEMP/flaxia-browser-tools/node_modules/playwright/cli.js" install firefox
      - name: Deploy candidate to a PR-specific Pages preview
        run: |
          set -o pipefail
          npx wrangler pages deploy dist \
            --project-name flaxia \
            --branch "$BENCH_DEPLOY_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "PR #$PR_NUMBER Arcade benchmark" \
            2>&1 | tee "$RUNNER_TEMP/flaxia-pages-deploy.log"
          preview_origin="$(sed -n 's/.*Deployment alias URL: //p' "$RUNNER_TEMP/flaxia-pages-deploy.log" | tail -n 1 | tr -d '\r')"
          if [ -z "$preview_origin" ]; then
            echo "Wrangler did not report the PR preview alias" >&2
            cat "$RUNNER_TEMP/flaxia-pages-deploy.log"
            exit 1
          fi
          echo "ARCADE_BENCH_URL=${preview_origin}/arcade" >> "$GITHUB_ENV"
          echo "Benchmark target: ${preview_origin}/arcade"
        env:
          BENCH_DEPLOY_BRANCH: bench-pr-${{ github.event.pull_request.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Wait for the candidate preview
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error "$ARCADE_BENCH_URL" --output /dev/null; then
              echo "Candidate preview is ready: $ARCADE_BENCH_URL"
              exit 0
            fi
            echo "Waiting for candidate preview (attempt $attempt/20)"
            sleep 3
          done
          echo "Candidate preview did not become available: $ARCADE_BENCH_URL" >&2
          exit 1
      - name: Measure production cold Chromium request waterfall
        continue-on-error: true
        run: node scripts/bench-arcade-cold.mjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/flaxia-browser-tools/node_modules/playwright/index.mjs
          LOADER_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
          ARCADE_BENCH_URL: https://flaxia.app/arcade
          ARCADE_BENCH_LABEL: production
          ARCADE_BENCH_BROWSER: chromium
          ARCADE_BENCH_TRIALS: 3
      - name: Measure production cold Firefox request waterfall
        continue-on-error: true
        run: node scripts/bench-arcade-cold.mjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/flaxia-browser-tools/node_modules/playwright/index.mjs
          ARCADE_BENCH_URL: https://flaxia.app/arcade
          ARCADE_BENCH_LABEL: production
          ARCADE_BENCH_BROWSER: firefox
          ARCADE_BENCH_TRIALS: 3
      - name: Measure PR candidate cold Chromium request waterfall
        continue-on-error: true
        run: node scripts/bench-arcade-cold.mjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/flaxia-browser-tools/node_modules/playwright/index.mjs
          LOADER_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
          ARCADE_BENCH_LABEL: candidate
          ARCADE_BENCH_BROWSER: chromium
          ARCADE_BENCH_TRIALS: 3
      - name: Measure PR candidate cold Firefox request waterfall
        continue-on-error: true
        run: node scripts/bench-arcade-cold.mjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/flaxia-browser-tools/node_modules/playwright/index.mjs
          ARCADE_BENCH_LABEL: candidate
          ARCADE_BENCH_BROWSER: firefox
          ARCADE_BENCH_TRIALS: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcade-cold-load-waterfalls
          path: artifacts/arcade-cold-*.json
          if-no-files-found: warn
