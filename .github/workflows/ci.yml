name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # onnxruntime-node binary download fails in CI; we only use the web build
  ONNXRUNTIME_NODE_DISABLE_DOWNLOAD: 1

jobs:
  auth-service-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: TeamFlaxia/flaxia-auth
          ref: 6a1e022ef52c6ac888bbbe446b2377926d5981da
          path: .integration/flaxia-auth
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: .integration/flaxia-auth
      - run: npm run build
      - run: npm run migrate:local
      - run: npx wrangler d1 migrations apply flaxia-auth-prod --local
        working-directory: .integration/flaxia-auth
      - name: Test the actual Workers and service binding
        env:
          FLAXIA_AUTH_TEST_URL: http://127.0.0.1:8792
          FLAXIA_APP_TEST_URL: http://localhost:8788
        run: |
          set -euo pipefail
          npm run dev:do > /tmp/auth-it-do.log 2>&1 &
          npm run dev:multiplayer > /tmp/auth-it-multiplayer.log 2>&1 &
          (cd .integration/flaxia-auth && npx wrangler dev --local --ip 127.0.0.1 --port 8792) > /tmp/auth-it-auth.log 2>&1 &
          npm run dev:test > /tmp/auth-it-app.log 2>&1 &
          trap 'jobs -pr | xargs -r kill; cat /tmp/auth-it-{auth,app}.log' EXIT
          for i in $(seq 1 90); do
            if curl -fsS "$FLAXIA_AUTH_TEST_URL/health" >/dev/null && curl -fsS "$FLAXIA_APP_TEST_URL/" >/dev/null && grep -q 'env.AUTH_SERVICE .*local \[connected\]' /tmp/auth-it-app.log; then break; fi
            sleep 1
          done
          curl -fsS "$FLAXIA_AUTH_TEST_URL/health" >/dev/null
          curl -fsS "$FLAXIA_APP_TEST_URL/" >/dev/null
          grep -q 'env.AUTH_SERVICE .*local \[connected\]' /tmp/auth-it-app.log
          node --experimental-strip-types --test tests/integration/flaxia-auth.worker.test.ts

  game-loader-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Use the runner's installed Chrome; avoid OS package/browser downloads.
      - run: npm install --prefix "$RUNNER_TEMP/flaxia-browser-tools" --package-lock=false --ignore-scripts playwright@1.62.1
      - run: npm run build:game-loader
      - run: node scripts/build-native-game-harness.mjs
      - run: npm run test:game-loader:browser
        env:
          LOADER_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/flaxia-browser-tools/node_modules/playwright/index.mjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx @biomejs/biome ci .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Apply migrations before starting the readiness timeout
        run: npm run migrate:local
      - name: Start dev server and run tests
        run: |
          set -o pipefail
          # The pages dev server binds Durable Objects hosted by these two
          # workers; start them first so the bindings connect.
          npm run dev:do &
          DO_PID=$!
          npm run dev:multiplayer &
          MP_PID=$!
          npm run dev:test &
          SERVER_PID=$!
          SERVER_READY=false
          for i in $(seq 1 60); do
            if curl -s http://localhost:8788 > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              SERVER_READY=true
              break
            fi
            sleep 1
          done
          if [ "$SERVER_READY" = false ]; then
            echo "Server failed to start within 60s"
            kill $SERVER_PID $MP_PID $DO_PID 2>/dev/null || true
            exit 1
          fi
          mkdir -p coverage
          EXIT_CODE=0
          npm test -- --experimental-test-coverage 2>&1 | tee coverage/test-output.log || EXIT_CODE=$?
          kill $SERVER_PID $MP_PID $DO_PID 2>/dev/null || true
          exit "$EXIT_CODE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
