name = "flaxia-ap-delivery"
main = "functions/queue-worker.ts"
compatibility_date = "2026-06-02"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "flaxia"
database_id = "7c99f35f-69a0-4644-96a1-34c716a3e82d"

[[services]]
binding = "AUTH_SERVICE"
service = "flaxia-auth"
entrypoint = "FlaxiaBridge"

# Scheduled account deletion removes MAIL_DB/R2 data through this binding.
[[services]]
binding = "MAIL_SERVICE"
service = "flaxia-mail"

[vars]
BASE_URL = "https://flaxia.app"
CROWD_ORCHESTRATOR_URL = "https://crowd.flaxia.app"
# Comma-separated seed domains for the Common Crawl ingestion job (empty until
# an operator chooses the first set). CROWD_API_KEY and CROWD_WEBHOOK_SECRET are
# secrets:
#   npx wrangler secret put CROWD_API_KEY --config wrangler.worker.toml
#   npx wrangler secret put CROWD_WEBHOOK_SECRET --config wrangler.worker.toml
CC_DOMAINS = ""
CC_CRAWL = ""
WEB_EMBEDDINGS_ENABLED = "0"
# Optional: override the default seed instances for the federated popularity
# pool (comma separated domains). Empty keeps the built-in seed list.
AP_POOL_SEED_DOMAINS = ""
# Optional: destination for the Arcade dwell dataset. Set HF_TOKEN as a secret:
#   npx wrangler secret put HF_TOKEN --config wrangler.worker.toml
# HF_REPO = "youruser/flaxia-arcade-dwell"

[[kv_namespaces]]
binding = "EXPORT_KV"
id = "5bae08ca0489493d878e18dd64c44c4a"

[[kv_namespaces]]
binding = "CACHE"
id = "c78f7711cd9d45738678474d884734c1"

[[r2_buckets]]
binding = "EXPORT_BUCKET"
bucket_name = "flaxia-exports"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "flaxia-content"

[triggers]
crons = ["0 4 * * *", "30 4 * * *", "0 * * * *", "5 * * * *"]

# The worker both consumes deliveries and produces the activities it has to
# answer (Accept for a Follow, Undo, ...). Without the producer binding
# `deliverToInbox` silently drops those replies.
[[queues.producers]]
queue = "activitypub-delivery"
binding = "AP_DELIVERY_QUEUE"

[[queues.consumers]]
queue = "activitypub-delivery"
max_batch_size = 10
max_batch_timeout = 5
# Retry transient failures a bounded number of times, then quarantine them.
max_retries = 3
dead_letter_queue = "activitypub-delivery-dlq"

# Dead letters are consumed by this worker as well: it stores them in the
# ap_dlq D1 table and acknowledges them only after a successful insert. A
# failed insert is retried (bounded by max_retries) instead of acknowledged,
# so a database outage cannot silently discard the durable copy.
[[queues.consumers]]
queue = "activitypub-delivery-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 1
