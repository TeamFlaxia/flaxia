<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flaxia Game Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    #container { width: 100%; height: 100%; }
    #loading { display: flex; align-items: center; justify-content: center; height: 100%; font-family: system-ui, sans-serif; color: #666; }
    #error { display: none; padding: 20px; color: #c00; text-align: center; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="container">
    <div id="loading">Preparing game preview...</div>
    <div id="error"></div>
  </div>
  <script type="module" src="/zip-preview.js"></script>
</body>
</html>
