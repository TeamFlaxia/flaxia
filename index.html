<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flaxia</title>
  <meta name="description" content="The SNS where your posts are playable.">
  <meta property="og:title" content="Flaxia">
  <meta property="og:description" content="The SNS where your posts are playable.">
  <meta property="og:image" content="https://flaxia.app/og-default-v2.png">
  <meta property="og:url" content="https://flaxia.app">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Flaxia">
  <meta name="twitter:description" content="The SNS where your posts are playable.">
  
  <link rel="preconnect" href="https://flaxia.app">
  <link rel="dns-prefetch" href="/api">
  
  <!-- Noto Sans Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">

  <meta name="google-adsense-account" content="ca-pub-8703789531673358">
  
  <meta name="theme-color" content="#ffffff">
  
  <!-- Theme boot: apply theme before first paint to avoid FOUC -->
  <script>
    (function () {
      var theme;
      var meta;
      try {
        theme = localStorage.getItem('flaxia_theme');
        if (theme === 'system' || theme === null) {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.dataset.theme = theme;
          meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = theme === 'dark' ? '#09090b' : '#ffffff';
        }
      } catch (_e) {}
    })();
  </script>
  
  <!-- Critical CSS inline (variables, reset, layout, nav, post basics) -->
  <style>
    :root {
      color-scheme: light;
      --font-sans: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-display: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --bg-primary: #ffffff;
      --bg-secondary: #f4f4f5;
      --bg-input: #ffffff;
      --bg-tertiary: #ececee;
      --bg-hover: rgba(9, 9, 11, 0.045);
      --border: #e4e4e7;
      --border-strong: #d4d4d8;
      --text-primary: #09090b;
      --text-secondary: #3f3f46;
      --text-muted: #6b6b74;
      --primary: #18181b;
      --primary-fg: #fafafa;
      --accent: #15803d;
      --accent-dark: #166534;
      --accent-text: #15803d;
      --accent-soft: #f0fdf4;
      --on-accent: #ffffff;
      --coral: #ef4444;
      --coral-text: #dc2626;
      --danger: #dc2626;
      --danger-text: #b91c1c;
      --link: #2563eb;
      --ring: rgba(24, 24, 27, 0.22);
      --gradient-accent: linear-gradient(0deg, #15803d 0%, #15803d 100%);
      --shadow-xs: 0 1px 2px rgba(9, 9, 11, 0.05);
      --shadow-sm: 0 1px 3px rgba(9, 9, 11, 0.08), 0 1px 2px rgba(9, 9, 11, 0.04);
      --shadow-md: 0 8px 24px rgba(9, 9, 11, 0.1);
      --radius-card: 12px;
    }
    :root[data-theme='dark'] {
      color-scheme: dark;
      --bg-primary: #09090b;
      --bg-secondary: #18181b;
      --bg-input: #09090b;
      --bg-tertiary: #27272a;
      --bg-hover: rgba(250, 250, 250, 0.06);
      --border: #27272a;
      --border-strong: #3f3f46;
      --text-primary: #fafafa;
      --text-secondary: #d4d4d8;
      --text-muted: #a1a1aa;
      --primary: #fafafa;
      --primary-fg: #18181b;
      --accent: #166534;
      --accent-dark: #14532d;
      --accent-text: #4ade80;
      --accent-soft: rgba(74, 222, 128, 0.12);
      --on-accent: #ffffff;
      --coral: #f87171;
      --coral-text: #fca5a5;
      --danger: #f87171;
      --danger-text: #fca5a5;
      --link: #60a5fa;
      --ring: rgba(250, 250, 250, 0.3);
      --gradient-accent: linear-gradient(0deg, #166534 0%, #166534 100%);
      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.5);
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.55);
      --radius-card: 12px;
      --bottom-nav-h: 0px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    #app {
      display: flex;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 0;
    }
    .initial-loader {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .initial-loader-content {
      text-align: center;
      color: var(--text-muted);
      font-family: monospace;
    }
    .initial-loader-spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    .page-loader {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-primary);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
      opacity: 0; transition: opacity 0.15s ease;
      pointer-events: none;
    }
    .page-loader.active {
      opacity: 1;
      pointer-events: auto;
    }
    .page-loader-content {
      text-align: center;
      color: var(--text-muted);
      font-family: monospace;
    }
    .page-loader-spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .main-container {
      display: flex;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }
    .left-nav {
      width: 240px; flex-shrink: 0; padding: 1rem;
      border-right: 1px solid var(--border); background: var(--bg-primary);
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
    }
    .main-content {
      flex: 1; max-width: 600px; padding: 1rem;
      border-right: 1px solid var(--border);
    }
    .right-panel {
      width: 350px; flex-shrink: 0; padding: 1rem;
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
    }
    .nav-logo { margin-bottom: 2rem; }
    .nav-items {
      display: flex; flex-direction: column; gap: .25rem; margin-bottom: 2rem;
    }
    .nav-item {
      display: flex; align-items: center; padding: .75rem 1rem;
      background: transparent; border: none; border-radius: 9999px;
      color: var(--text-primary); cursor: pointer;
      font-family: 'Noto Sans', monospace; font-size: 1rem; font-weight: 400;
      transition: background-color 0.2s ease, color 0.2s ease;
      text-align: left; width: 100%;
    }
    .nav-item:hover { background: var(--bg-secondary); }
    .nav-item--active { color: var(--accent-text); font-weight: 600; }
    .nav-post-button {
      width: 100%; padding: .75rem 1rem; background: var(--accent);
      color: #000; border: none; border-radius: 9999px;
      font-family: 'Noto Sans', monospace; font-size: 1rem; font-weight: bold;
      cursor: pointer; transition: background-color .2s;
    }
    .nav-post-button:hover { background: var(--accent-dark); }
    .search-section { margin-bottom: 1.5rem; }
    .search-box { position: relative; margin-bottom: 1rem; }
    .search-input {
      width: 100%; padding: .75rem 1rem .75rem 2.5rem;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 9999px; color: var(--text-primary);
      font-family: 'Noto Sans', monospace; font-size: .875rem;
      outline: none; transition: border-color .2s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--text-muted); }
    .search-icon {
      position: absolute; left: .75rem; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: .875rem;
    }
    .trending-section, .follow-section, .ad-section { margin-bottom: 1.5rem; }
    .section-title {
      font-size: 1.125rem; font-weight: 600; color: var(--text-primary);
      margin-bottom: .75rem; padding: 0 .5rem;
    }
    @media (max-width: 1024px) {
      .right-panel { display: none; }
      .main-container { max-width: 840px; }
    }
    @media (max-width: 768px) {
      .left-nav {
        position: fixed; top: 0; left: 0; width: 280px; height: 100vh;
        border-right: 1px solid var(--border); border-top: none;
        padding: 1rem; z-index: 1100; transform: translateX(-100%);
        transition: transform .3s; background: var(--bg-primary);
        overflow-y: auto; -webkit-overflow-scrolling: touch;
      }
      .left-nav--open { transform: translateX(0); box-shadow: 4px 0 12px rgba(0,0,0,0.15); }
      .left-nav-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.5); z-index: 1099;
        opacity: 0; visibility: hidden; transition: opacity .3s, visibility .3s;
      }
      .left-nav-overlay--visible { opacity: 1; visibility: visible; }
      .main-content { padding-bottom: 1rem; }
      .main-container { flex-direction: column; }
    }
  </style>
  
  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const langParam = urlParams.get('lang');
      const userLang = langParam || navigator.language || navigator.userLanguage || 'en';
      const isJapanese = userLang.startsWith('ja');
      
      const metaTags = {
        title: isJapanese ? 'Flaxia' : 'Flaxia',
        description: isJapanese ? 'ゲームやアプリをそのまま投稿できるSNS' : 'The SNS where your posts are playable.',
        ogTitle: isJapanese ? 'Flaxia' : 'Flaxia',
        ogDescription: isJapanese ? 'ゲームやアプリをそのまま投稿できるSNS' : 'The SNS where your posts are playable.',
        twitterTitle: isJapanese ? 'Flaxia' : 'Flaxia',
        twitterDescription: isJapanese ? 'ゲームやアプリをそのまま投稿できるSNS' : 'The SNS where your posts are playable.',
        ogImage: 'https://flaxia.app/og-default-v2.png',
        ogUrl: 'https://flaxia.app',
        twitterCard: 'summary_large_image'
      };
      
      document.title = metaTags.title;
      const setMeta = (selector, attr, value) => {
        const el = document.querySelector(selector);
        if (el) el.setAttribute(attr, value);
      };
      setMeta('meta[name="description"]', 'content', metaTags.description);
      setMeta('meta[property="og:title"]', 'content', metaTags.ogTitle);
      setMeta('meta[property="og:description"]', 'content', metaTags.ogDescription);
      setMeta('meta[property="og:image"]', 'content', metaTags.ogImage);
      setMeta('meta[property="og:url"]', 'content', metaTags.ogUrl);
      setMeta('meta[name="twitter:card"]', 'content', metaTags.twitterCard);
      setMeta('meta[name="twitter:title"]', 'content', metaTags.twitterTitle);
      setMeta('meta[name="twitter:description"]', 'content', metaTags.twitterDescription);
      
      document.documentElement.lang = isJapanese ? 'ja' : 'en';
    })();
  </script>

</head>
<body>
  <!-- Initial loading indicator -->
  <div class="initial-loader" id="initial-loader">
    <div class="initial-loader-content">
      <div class="initial-loader-spinner"></div>
      <div>Loading Flaxia...</div>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>

  <script>
    // Hide initial loader when app is ready
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const loader = document.getElementById('initial-loader');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.transition = 'opacity 0.3s ease';
          setTimeout(() => loader.remove(), 300);
        }
      }, 100);
    });
  </script>
</body>
</html>
